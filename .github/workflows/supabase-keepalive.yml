name: Supabase keep-alive

# SeeON Supabase 프로젝트가 "7일 이상 활동 없음"으로 일시정지되지 않게
# 3일마다 공개 함수(seeon_public_config)를 한 번 호출합니다.
# 게임 페이지가 비회원 상태에서도 부르는 함수라 공개 키(publishable key)로 호출해도 안전합니다.

on:
  schedule:
    - cron: "17 3 */3 * *"   # 3일마다 03:17 UTC (한국 12:17)
  workflow_dispatch:         # Actions 탭에서 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call seeon_public_config
        env:
          SUPABASE_URL: https://sboilhilcsmitonuqqzi.supabase.co
          SUPABASE_KEY: sb_publishable_JDuvUDlSa04vsKr42WMIvQ_0RJ-qdBu
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/seeon_public_config" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $code"; cat /tmp/out.json; echo
          test "$code" = "200"
